name: Release
on:
  push:
    tags: ["v*"]
permissions:
  # gh release create needs write access
  contents: write
jobs:
  release:
    name: Release build
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - name: Check out source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # needed to calc build number via git log --oneline
          fetch-depth: 0
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build static release exe
        run: bun .\cmd\build.ts -static

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG.TrimStart("v")
          $asset = "SumatraPDF-$ver.exe"
          Copy-Item out\rel64\SumatraPDF-static.exe $asset
          gh release create $env:TAG $asset --title "SumatraPDF $env:TAG" --generate-notes
